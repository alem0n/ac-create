name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: 同步依赖
        run: uv sync --extra dev
      - name: 运行完整质量门禁
        run: make check
      - name: 分层依赖契约校验
        run: make layer-contracts
